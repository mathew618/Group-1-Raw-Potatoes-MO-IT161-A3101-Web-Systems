<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtifyPH | Select Payment Method</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./styles/style.css">

    <!-- JavaScript -->
    <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="./scripts/main.js" defer></script>
    <script src="./scripts/account.js" defer></script>
    <script src="./scripts/commission.js" defer></script>
    <script src="./scripts/validationstuff.js" defer></script>
    <script src="./scripts/payment.js" defer></script>
</head>

<body>
    <header id="header"></header>

    <main>
        <!-- Choose payment option -->
        <section class="PageCard">

            <h2 class="PaymentTitle">Select Payment Method </h2>

            <!-- Payment Options -->
            <!-- Basically, you have to click one of these payment methods in 
                order for the "Next" button to work. 
                Then, let's say user clicks Credit Card, they'll link into Credit card payment page, 
                different from gcash or paymaya -->

            <div class="PageCard PaymentOption">
                <label>
                    <input type="radio" name="payment" value="card">
                    <img src="assets/images/Card_Icon.png" alt="Card Icon" class="PaymentOptionLogo">
                    Credit/ Debit Card
                </label><br>
            </div>

            <div class="PageCard PaymentOption">
                <label>
                    <input type="radio" name="payment" value="gcash">
                    <img src="assets/images/Payment_GcashLogo_1.png" alt="GCash Logo" class="PaymentOptionLogo">
                    GCash
                </label><br>
            </div>

            <div class="summary">
                <!-- Cost Summary | I made this Example -->
                <h3>Order Summary</h3>
                <p>Cost: <span id="CostAmount">₱500.00</span></p>
                <p>Shipping: ₱0.00</p>
                <p><strong>Total: <span id="TotalAmount">₱500.00</span></strong></p><br>
            </div>

            <!-- Info -->
    
            <p class="PaymentNote">*Payment will only be processed once the artist accepts the commission request.<br>
                Rejected requests are automatically refunded.</p>
    

            <p class="PaymentError" id="PaymentError"></p>

            <div class="buttonBox">
            <button type="button" class="ActionButton" onclick="goToPayment()">Next</button>
            </div>
        </section>

    </main>
</body>

</html>
