<!DOCTYPE html>
<html>

<head>
    <title>ArtifyPH - Gcash Payment</title>
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/pages/gcashpayment.css">
</head>

<body>
    <header>
        <!-- Logo -->
        <a href="index.html" class="ArtifyPHLogo">
            <img src="assets/images/ArtifyPH_Logo.png" alt="ArtifyPHLogo">
        </a>
        <!-- Navigation Bar -->
        <nav>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="settings.html">Settings</a></li>
            </ul>
        </nav>
    </header>


    <main>
        <!-- Someone help please -->
        <section class="gcash">

            <h2>Payment Details</h2>

            <div class="logoBox">
                <img src="assets/images/Payment_GcashLogo_1.png" alt="GCash Logo" class="gcashLogo">
                <h3>GCash</h3>
            </div>

            <!-- Is this correct way to do it? -->

            <label for="gcashNumber">Gcash number:</label><br>
            <input type="tel" id="gcashNumber" name="gcashNumber" placeholder="e.g., 0912 345 6789" required><br><br>

            <div class="summary">
                <!-- Cost Summary | I made this Example -->
                <h3>Order Summary</h3>
                <p>Cost: ₱500.00</p>
                <p>Shipping: ₱0.00</p>
                <p><strong>Total: ₱500.00</strong></p><br>
            </div>

            <!-- Button -->
            <!-- To Mat - Can you make it that when button is clicked, it says "Payment Successful"? Thanks! -->
            <button type="button" onclick="processPayment()">Pay Now</button>

            <div class="buttonBox">
                <a href="profile.html" class="done-button">Done</a>
            </div>
        </section>


    </main>

</body>

</html>
