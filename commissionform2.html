<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtifyPH | Commission Form2</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./styles/style.css">

    <!-- JavaScript -->
    <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="./scripts/main.js" defer></script>
    <script src="./scripts/account.js" defer></script>
    <script src="./scripts/validationstuff.js" defer></script>
    <script src="./scripts/commission.js" defer></script>
</head>

<body class="d-flex flex-column min-vh-100" data-commission="details">
    <header id="header"></header>

    <main class="flex-grow-1">

        <section class="container py-4 mt-4">
            <div class="row justify-content-center">
                <div class="col-12 col-md-10 col-lg-8 col-xl-7">
                    <div class="card card-artify shadow-sm CommissionForm2">
                        <div class="card-header text-white d-flex justify-content-between align-items-center">
                            <h5 class="card-title mb-0" id="TargetArtist"></h5>
                        </div>

                        <div class="card-body px-4">
                            <p class="CommissionRequiredNote"><span class="RequiredStar">*</span> Required Fields</p>
                            <!-- Commission Form -->
                            <form id="commissionForm" onsubmit="createCommission(event)">
                                <!-- Name/ Username -->
                                <div class="mb-3">
                                    <label for="name" class="form-label">Name / Username <span class="RequiredStar" aria-hidden="true">*</span></label>
                                    <input type="text" id="name" name="name" class="form-control input-artify" placeholder="Enter Username" readonly required autocomplete="username">
                                </div>

                                <!-- Email -->
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email <span class="RequiredStar" aria-hidden="true">*</span></label>
                                    <input type="email" id="email" name="email" class="form-control input-artify" placeholder="Enter Email" readonly required autocomplete="email">
                                </div>


                                <!-- Commission Type (Dropdown) This is awesome :D -->
                                <div class="mb-3">
                                    <label for="type" class="form-label">Commission Type <span class="RequiredStar" aria-hidden="true">*</span></label>
                                    <select class="form-select form-control input-artify" id="type" name="type" required>
                                        <option value="">-- Select Type --</option>
                                        <option value="Sketch">Digital Art</option>
                                        <option value="Colored">Traditional Art</option>
                                        <option value="Fully Rendered">Crafts</option>
                                    </select>
                                </div>

                                <!-- Additional Details / User can write what they want to add -->
                                <div class="mb-3">
                                    <label for="details" class="form-label">Additional Details</label>
                                    <textarea class="form-control" rows="4" cols="5" id="details" name="details"></textarea>
                                </div>

                                <!-- Upload Reference -->
                                <div class="mb-3">
                                    <label for="reference" class="form-label">Upload Reference</label>
                                    <input type="file" id="reference" name="reference" class="form-control"
                                        accept=".jpeg,.jpg,.png,.avif,.svg,image/jpeg,image/png,image/avif,image/svg+xml">
                                </div>

                                <!-- Deadline | DD/MM/YYYY -->
                                <div class="mb-3">
                                    <label for="deadline" class="form-label">Deadline <span class="RequiredStar" aria-hidden="true">*</span></label>
                                    <input type="date" id="deadline" name="deadline" class="form-control input-artify" required>
                                </div>

                                <!-- Budget | Must only be number-->
                                <div class="mb-3">
                                    <label for="budget" class="form-label">Budget (in PHP) <span class="RequiredStar" aria-hidden="true">*</span></label>
                                    <div class="form-floating mb-3 mt-3">
                                        <input type="number" id="budget" name="budget" class="form-control input-artify" placeholder="0" min="0" max="100000" required>
                                        <label for="budget">₱</label>
                                    </div>
                                </div>

                                <!-- Preferred Communication Platform -->
                                <div class="mb-3">
                                    <label for="platform" class="form-label">Preferred Communication Platform</label>
                                    <input class="form-control" list="platformlist" type="text" name="platform" id="platform" placeholder="e.g., Email, Discord, Messenger">
                                    <datalist id="platformlist">
                                        <option value="Email">
                                        <option value="Discord">
                                        <option value="Messenger">
                                        <option value="Reddit">
                                        <option value="Instagram">
                                    </datalist>
                                </div>

                                <!-- Terms of Service Checkbox -->
                                <div class="form-check form-check-artify mb-3">
                                    <input class="form-check-input" type="checkbox" id="agreement" name="agreement" required>
                                    <label class="form-check-label small" for="agreement">I understand that submitting this request does not guarantee the commission will be accepted. <span class="RequiredStar" aria-hidden="true">*</span></label>
                                </div>

                                <p class="CommissionError" id="CommissionError"></p>

                                <!-- Next Button - Will proceed payment-->
                                <div class="text-end mb-4">
                                    <button type="submit" class="btn btn-artify px-4">Next</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <footer id="footer"></footer>
</body>

</html>
