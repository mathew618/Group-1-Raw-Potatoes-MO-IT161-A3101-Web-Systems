<!DOCTYPE html>
<Html>

<head>
    <title> ArtifyPH Create Account </title>
</head>

<!-- CSS FOR LOGIN STRUCTURE-->

<style>
    /* Background*/
    body {
        background-color: #FEE8D3;
        font-family: Arial, sans-serif;
    }

    /* Header Logo*/
    header {
        display: flex;
        justify-content: space-between;
        align-items: center;

        background-color: #FA987F;
        color: #ece6e6;
        min-height: 100px;
        position: fixed;
        padding: 0 40px;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;
    }

    /*LOGO*/
    .ArtifyPHLogo {
        width: 180px;
        cursor: pointer;
    }

    /*Section*/
    section.SignUp {
        background-color: #ffffff;
        margin: 20px auto;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        max-width: 500px;
        text-align: center;
        margin-bottom: 50px;

    }

    /*Create Account Title*/
    .SignUp h1 {
        font-weight: bold;
        font-family: Inter, sans-serif;
        font-size: 30px;
        text-align: center;
        color: #eda27c;
        margin-bottom: 5px;


     }

    /*Labels*/
    .Username p,
    .Email p,
    .Password p,
    .ConfirmPassword p {
        font-weight: 400;
        font-family: Arial, sans-serif;
        font-size: 15px;
        text-align: left;
        color: #2e2c2c;
        margin-bottom: 5px;

    }

    /*Inputs*/
    .Username input,
    .Email input,
    .Password input,
    .ConfirmPassword input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        background-color: #e2e2e2;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        margin-bottom:0px;

    }

    input[type = "submit"] {
        background-color: #eda27c;
        color: #ffffff;
        border: none;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        border-radius: 5px;
        margin-top: 20px;
    }
     input[type = "submit"]:hover {
        background-color: #B04825;
     }

</style>

<body>
    <header class="header">
        <div class="ArtifyPHLogo">
            <img src="Test_Account_Assets/ArtifyPH_Logo.png" class="ArtifyPHLogo">
        </div>
    </header>
    <br><br><br><br><br><br><br><br>

    <section class="SignUp">

        <h1>Create Account</h1> <br>

        <div class="Username">
            <p>Username</p>
            <label for="username"></label>
            <input type="text" name="username" placeholder="Enter Username"> <br> <br>
        </div>

        <div class="Email">
            <p>Email</p>
            <label for="email"></label>
            <input type="email" name="email" placeholder="Enter Email"> <br> <br>
        </div>

        <div class="Password">
            <p>Password</p>
            <label for="password"></label>
            <input type="password" name="password" placeholder="Enter Password"> <br> <br>
        </div>

        <div class="ConfirmPassword">
            <p>Confirm Password</p>
            <label for="confirm_password"></label>
            <input type="password" name="confirm_password" placeholder="Confirm Password"> <br> <br>
            
            <a href = "test_account_home.html">
            <input type="submit" value="Create Account"> </a>
        </div>

    </section>

</body>

</Html>
