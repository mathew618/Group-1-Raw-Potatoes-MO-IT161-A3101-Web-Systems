<!DOCTYPE html>
<html>

<head>
    <title>ArtifyPH - Artist Profile</title>
    <style>
        .Logo {
            text-align: left;
            margin-bottom: 10px;
        }

        .Navigation_Buttons a {
            text-decoration: none;
        }

        .Navigation_Buttons button {
            background-color: #d16767;
            color: #faf8f8;
            border: 2px solid #832a2a;
            padding: 8px 16px;
            margin: 10px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        .Navigation_Buttons button:hover {
            background-color: #382727;
        }

        .Navigation_Bar {
            background-color: #ec876e;
            border: 2px solid #832a2a;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 50px 50px rgba(122, 2, 2, 0.1);
        }

        .MyUserBannerBG {
            position: relative;
            margin-bottom: 70px;
        }

        .MyUserBannerBG img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            display: block;
        }

        .MyAvatarProfilePic {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: -60px;
        }

        .MyAvatarProfilePic img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #f8ebe2;
        }

        .MyProfileDesc {
            padding: 0 40px;
            text-align: center;
        }

        #MyDescEdit {
            display: block;
            width: 100%;
            max-width: 500px;
            height: 80px;
            box-sizing: border-box;
            resize: none;
            padding: 8px;
            font-size: 14px;
            border: 1px solid #832a2a;
            border-radius: 4px;
            margin: 0 auto;
        }

        .PorkNBeans {
            text-align: center;
        }

        .PorkNBeans button {
            background-color: #d16767;
            color: #faf8f8;
            border: 2px solid #832a2a;
            padding: 8px 16px;
            margin: 10px auto;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
        }

        .PorkNBeans button:hover {
            background-color: #832a2a;
        }

        .PorkNBeans button.active {
            background-color: #832a2a;
            color: #ffffff;
        }

    </style>
</head>

<body>
    <!-- Navigation Bar -->
    <div class="Navigation_Bar" id="Navigation_Bar">
        <div class="Logo">
            <h1>ArtifyPH</h1>
            <h3>Art By Hand</h3>
        </div>

        <div class="Navigation_Buttons">
            <a href="test_account_home.html"><button>Home</button></a>
            <a href="commission.html"><button>Commissions</button></a>
            <a href="Test_Main.html"><button>About</button></a>
            <a href="test_settings.html"><button>Settings</button></a>
        </div>
    </div>

    <div class="MyProfile" id="MyProfile">
        <!-- Artist Banner & Cover Section -->
        <div class="MyUserBannerBG">
            <img id="UserBannerImg" src="Test_Account_Assets/MyProfile_BG_Template.png"
                onclick="document.getElementById('bannerInput').click()" style="cursor:pointer;">
            <input type="file" id="bannerInput" accept="image/*" style="display:none;"
                onchange="previewImage(event, 'UserBannerImg')">
            <br><br>

            <!-- Profile Picture & Bio -->
            <div class="MyAvatarProfilePic">
                <img id="ProfilePicImg" src="Test_Account_Assets/MyAvatar_Pic_Template.png"
                    onclick="document.getElementById('profilePicInput').click()" style="cursor:pointer;">
                <input type="file" id="profilePicInput" accept="image/*" style="display:none;"
                    onchange="previewImage(event, 'ProfilePicImg')">
            </div>
        </div>

        <div class="MyProfileDesc">
            <h2 id="MyUsername">Justablub</h2>
            <p id="MyDesc">Hello!</p>
        </div>
    </div>
    <hr>

    <!-- Portfolio Section -->
    <div>
        <div class="MyProfileStuffToDoYes" id="MyProfileStuffToDoYes">
            <div class="PorkNBeans" id="PorkNBeans">
                <button id="button4Portfolio" onclick="showSection('portfolio')">Portfolio</button>
                <button id="button4Commission" onclick="showSection('commission')">Commission</button>
            </div>
        </div>

        <div class="TF2Toolbar">
            <input type="file" id="uploadInput" accept="image/*" style="display:none;"
                onchange="addImageToGallery(event)">
            <button onclick="document.getElementById('uploadInput').click()">+</button>
            <button id="ButtonWobblyGoopler" onclick="toggleEditMode()">Edit</button>
        </div>

        <div class="MyProfileImagesPortfolio" id="MyProfileImagesPortfolio">
            <div class="Picnic" id="portfoliopicnic"></div>
        </div>

        <div class="MyProfileImagesCommissions" id="MyProfileImagesCommissions">
            <div class="Picnic" id="commissionpicnic"></div>
        </div>
    </div>

</body>
<script>
    /*For The Image Preview (banner/avatar) */
    function previewImage(event, imgId) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (e) {
            document.getElementById(imgId).src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    /*For Switching Between Portfolio and Commissions*/
    function showSection(section) {
        const portfolio = document.getElementById('MyProfileImagesPortfolio');
        const commissions = document.getElementById('MyProfileImagesCommissions');
        const button4Portfolio = document.getElementById('button4Portfolio');
        const button4Commission = document.getElementById('button4Commission');

        if (section === 'portfolio') {
            portfolio.style.display = 'block';
            commissions.style.display = 'none';
            button4Portfolio.classList.add('active');
            button4Commission.classList.remove('active');
        } else {
            portfolio.style.display = 'none';
            commissions.style.display = 'block';
            button4Portfolio.classList.remove('active');
            button4Commission.classList.add('active');
        }
    }

    /*MyProfile Examples Images Test for storing and editing*/
    const defaultPortfolioImages = [
        "Test_Account_Assets/MyProfileExamples/Portfolio1.png",
        "Test_Account_Assets/MyProfileExamples/Portfolio2.png"
    ];

    const defaultCommissionImages = [
        "Test_Account_Assets/MyProfileExamples/Commission1.png",
        "Test_Account_Assets/MyProfileExamples/Commission2.png"
    ];

    function ProfileSettingsSync() {
        const username = localStorage.getItem('LoggedUser');
        if (username) {
            document.getElementById('MyUsername').textContent = username;
        } else {
            window.location.href = "test_account_login.html";
            return;
        }

        const bio = localStorage.getItem('BioDesc');
        document.getElementById('MyDesc').textContent = bio || 'Hello!';

        showSection('portfolio');
        if (typeof renderGalleries === 'function') {
            renderGalleries();
        }
    }

    window.onload = ProfileSettingsSync;
    window.addEventListener('pageshow', ProfileSettingsSync);
</script>

</html>
