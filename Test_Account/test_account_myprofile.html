<!DOCTYPE html>
<html>

<head>
    <title>ArtifyPH - Artist Profile</title>
    <style>
        .Logo {
            text-align: left;
            margin-bottom: 10px;
        }

        .Navigation_Buttons a {
            text-decoration: none;
        }

        .Navigation_Buttons button {
            background-color: #d16767;
            color: #faf8f8;
            border: 2x solid #832a2a;
            padding: 8px 16px;
            margin: 10px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        .Navigation_Buttons button:hover {
            background-color: #382727;
        }

        .Navigation_Bar {
            background-color: #ec876e;
            border: 2px solid #832a2a;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 50px 50px rgba(122, 2, 2, 0.1);
        }

        .MyUserBannerBG {
            position: relative;
            margin-bottom: 70px;
        }

        .MyUserBannerBG img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            display: block;
        }

        .MyAvatarProfilePic {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: -60px;
        }

        .MyAvatarProfilePic img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            position: center;
            border-radius: 50%;
            border: 5px solid #f8ebe2;
        }

        .MyProfileDesc {
            padding: 0 40px;
            text-align: center;
        }

        #MyDescEdit {
            display: block;
            width: 100%;
            max-width: 500px;
            height: 80px;
            box-sizing: border-box;
            resize: none;
            padding: 8px;
            font-size: 14px;
            border: 1px solid #832a2a;
            border-radius: 4px;
            margin: 0 auto;
        }

        .MyProfileDesc button {
            background-color: #6d6464;
            color: #faf8f8;
            border: 2x solid #832a2a;
            padding: 8px 16px;
            margin: 10px auto;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;

        }

        .MyProfileDesc button:hover {
            background-color: #ffd0d0;
        }

        .PorkNBeans {
            text-align: center;
        }

        .PorkNBeans button {
            background-color: #d16767;
            color: #faf8f8;
            border: 2x solid #832a2a;
            padding: 8px 16px;
            margin: 10px auto;
            border-radius: 20px;
            position: center;
            font-size: 14px;
            cursor: pointer;
        }

        .PorkNBeans button:hover {
            background-color: #832a2a;
        }

        .PorkNBeans button.active {
            background-color: #832a2a;
            color: #ffffff;
        }

        .MyProfileImagesPortfolio table,
        .MyProfileImagesCommissions table {
            border-collapse: collapse;
            width: 100%;
            margin: 15px auto;
        }

        .MyProfileImagesPortfolio td,
        .MyProfileImagesCommissions td {
            border: 1px solid #f3f0f0;
            padding: 10px;
            text-align: center;
        }

        .MyProfileImagesPortfolio img,
        .MyProfileImagesCommissions img {
            border-radius: 6px;
        }
    </style>
</head>

<body>
    <!-- Navigation Bar -->

            <h1>ArtifyPH</h1>
            <h3>Art By Hand</h3>
        </div>

        <div class="Navigation_Buttons">
            <a href="test_account_home.html"><button>Home</button></a>
            <a href="commission.html"><button>Commissions</button></a>
            <a href="settings.html"><button>Settings</button></a>

    <hr>

    <div class="MyProfile" id="MyProfile">

        <div class="MyProfileDesc">

            <button id="EditBio" onclick="toggleEditBio()">✎</button>

    </div>
    <hr>

    <!-- Portfolio Section -->
    <div>
        <!-- Gallery Grid Of The User -->
        <div class=MyProfileStuffToDoYes id="MyProfileStuffToDoYes">
            <div class="PorkNBeans" id="PorkNBeans">
                <button id="button4Portfolio" onclick="showSection('portfolio')">Portfolio</button>

                    <td align="center">

                    </td>
                    <td align="center">
                        <img src="artwork3.jpg"width="200" height="200"><br>
                    </td>
                </tr>
                <tr>
                    <td align="center">
                        <img src="artwork4.jpg" width="200" height="200"><br>
                    </td>
                    <td align="center">
                        <img src="artwork5.jpg"  width="200" height="200"><br>
                    </td>
                    <td align="center">
                        <img src="artwork6.jpg"  width="200" height="200"><br>
                    </td>
                </tr>
            </table>
        </div>

        <div class="MyProfileImagesCommissions" id="MyProfileImagesCommissions">
            <table border="1" cellpadding="10" cellspacing="0">
                <tr>
                    <td align="center">
                        <img src="Test_Account_Assets/MyProfileExamples/Commission1.png" width="200" height="200"><br>
                    </td>
                    <td align="center">
                        <img src="Test_Account_Assets/MyProfileExamples/Commission2.png" width="200" height="200"><br>
                    </td>
                    <td align="center">
                        <img src="artwork3.jpg" width="200" height="200"><br>
                    </td>
                </tr>
                <tr>
                    <td align="center">
                        <img src="artwork4.jpg" width="200" height="200"><br>
                    </td>
                    <td align="center">
                        <img src="artwork5.jpg" width="200" height="200"><br>
                    </td>
                    <td align="center">
                        <img src="artwork6.jpg" width="200" height="200"><br>
                    </td>
                </tr>
            </table>
        </div>
    </div>

</body>
<script>
    /*For The Image Preview */
    function previewImage(event, imgId) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (e) {
            document.getElementById(imgId).src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    /*For The Bio Editing Thingy */
    function toggleEditBio() {
        const p = document.getElementById('MyDesc');
        const textarea = document.getElementById('MyDescEdit');
        const editbiot = document.getElementById('EditBio');
        const ediingbiochecker = textarea.style.display !== 'none';

        if (ediingbiochecker) {
            p.textContent = textarea.value;
            p.style.display = 'block';
            textarea.style.display = 'none';
            editbiot.textContent = 'Edit Bio';
            console.log('Saved bio:', textarea.value);
        } else {
            textarea.value = p.textContent;
            p.style.display = 'none';
            textarea.style.display = 'block';
            textarea.focus();
            editbiot.textContent = 'Save Bio';
        }
    }
    /*Login In */
    window.onload = function () {
        const username = localStorage.getItem('loggedInUser');
        if (username) {
            document.getElementById('MyUsername').textContent = username;
        } else {
            window.location.href = "login.html";
        }
    };

    /*For Portfolio and Commissions */
    /*For Switching Between Portfolio and Commissions*/
    function showSection(section) {
        const portfolio = document.getElementById('MyProfileImagesPortfolio');
        const commissions = document.getElementById('MyProfileImagesCommissions');
        const button4Portfolio = document.getElementById('button4Portfolio');
        const button4Commission = document.getElementById('button4Commission');

        if (section === 'portfolio') {
            portfolio.style.display = 'block';
            commissions.style.display = 'none';
            button4Portfolio.classList.add('active');
            button4Commission.classList.remove('active');
        } else {
            portfolio.style.display = 'none';
            commissions.style.display = 'block';
            button4Portfolio.classList.remove('active');
            button4Commission.classList.add('active');
        }
    }
    showSection('portfolio');
</script>

</html>
