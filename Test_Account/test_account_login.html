<!DOCTYPE html>
<html>

<head>
    <title>ArtifyPH Log In</title>
</head>

<!-- CSS FOR LOGIN STRUCTURE-->

<style>
    body {
        background-color: #FEE8D3;
        font-family: Arial, sans-serif;
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;

        background-color: #FA987F;
        color: #ece6e6;
        min-height: 100px;
        position: fixed;
        padding: 0 40px;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;
    }

    .ArtifyPHLogo {
        width: 180px;
        cursor: pointer;
    }

    /* THIS IS THE SQUARE BACKGROUND */
    section.SignIn {
        background-color: #ffffff;
        margin: 20px auto;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        max-width: 500px;
        text-align: center;
        margin-bottom: 50px;

    }

    /* THIS IS THE TEXT INSIDE */
    section.SignIn input[type="text"],
    section.SignIn input[type="password"] {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        background-color: #e2e2e2;
        border: none;
        border-radius: 6px;
        font-size: 14px;

    }

    section.SignIn input[type="checkbox"] {
        width: auto;
        margin-right: 1px;
        margin-top: 0;
        vertical-align: middle;
    }

    section.SignIn input:focus {
        border-color: #FA987F;
        outline: none;
    }

    /* THIS IS THE SIGN IN BUTTON*/
    section.SignIn button {
        background-color: #FA987F;
        color: #ffffff;
        border: none;
        padding: 12px;
        margin: 5px 0;
        font-size: 16px;
        cursor: pointer;
        border-radius: 6px;
        width: 75%;

    }

    section.SignIn button:hover {
        background-color: #B04825;

    }

    /* THIS ARE THE LABELS*/
    .InputEmail label,
    .InputPassword label {
        display: block;
        font-weight: 400;
        font-family: Arial, sans-serif;
        font-size: 14px;
        color: #474444;
        text-align: left;
    }

    /* SIGN IN BUTTON*/
    .SignInButton {
        text-align: center;
        margin-top: 10px;

    }

    /* CREATE ACCOUNT TEXT */
    .CreateAccountText {
        text-align: center;
        font-weight: 400;
        font-family: Arial, sans-serif;
        margin-top: 20px;

    }

    .InputPassword label[for="ShowPassword"] {
        font-weight: 400;
        font-family: Arial, sans-serif;
        font-size: 14px;
        text-align: center;
        margin: 10px;
        color: #474444;
        cursor: pointer;

    }

    input[type="checkbox"] {
        vertical-align: middle;
        margin-top: 30px;
    }

    .CreateAccountText a {
        color: #FA987F;
        text-decoration: none;
        font-weight: 400;
        font-family: Arial, sans-serif;
        font-size: 14px;
    }

    .CreateAccountText a:hover {
        text-decoration: underline;

    }

    .CreateAccountText {
        font-weight: 400;
        font-family: Arial, sans-serif;
        font-size: 14px;
        text-align: center;
        color: #474444;
    }

    .ShowPasswordContainer {
        display: flex;
        align-items: center;
        margin: 10px 0;

    }

    .ShowPasswordContainer input[type="checkbox"] {
        margin-right: 8px;

    }

    .ShowPasswordContainer label {
        font-size: 14px;
        color: #474444;
        cursor: pointer;

    }
</style>







<!-- HTML FOR LOGIN STRUCTURE-->

<body>

    <header class="header">
        <div class="ArtifyPHLogo">
            <img src="Test_Account_Assets/ArtifyPH_Logo.png" class="ArtifyPHLogo">
        </div>
    </header>
    <br><br><br><br><br><br><br><br>

    <section class="SignIn">

        <div class="InputEmail">

            <label for="email">Email</label> <br>
            <input type="text" id="email" placeholder="Enter Email"> <br> <br>

        </div>

        <div class="InputPassword">
            <label for="Password">Password</label><br>
            <input type="password" id="UserPassword" placeholder="Enter Password"><br>

            <div class="ShowPasswordContainer">
                <input type="checkbox" id="ShowPassword">
                <label for="ShowPassword">Show Password</label>
            </div>
        </div>

        <div class="SignInButton">

            <button onclick="checkLogin()">Sign In</button>

        </div>
        <p id="Invalid_Credentials" style="color:red;"></p>


        <p class="CreateAccountText">
            Don’t have an account?<br>
            <a href="CreateAcc.html">Create Account</a>
        </p>
    </section>



















    <!-- JAVA SCRIPT FOR LOGIN FUNCTIONALITY -->

    <script>
        /*A test account dummy -Fidel */
        function checkLogin() {
            const Email = document.getElementById('email').value.trim();
            const Password = document.getElementById('UserPassword').value;
            const DefaultUsername = "Justablub";
            const DefaultEmail = "ilosthotdogs@gmail.com";
            const DefaultPassword = "Beezytrave890";
            const SavedUsername = localStorage.getItem('LoggedUser') || DefaultUsername;
            const SavedEmail = localStorage.getItem('LoggedEmail') || DefaultEmail;
            const SavedPassword = localStorage.getItem('LoggedPassword') || DefaultPassword;

            const emailMatches = (Email === SavedUsername || Email === SavedEmail);

            if (emailMatches && Password === SavedPassword) {
                localStorage.setItem('LoggedUser', SavedUsername);
                localStorage.setItem('LoggedEmail', SavedEmail);
                localStorage.setItem('LoggedPassword', SavedPassword);
                window.location.href = "test_account_home.html";
            } else {
                document.getElementById('Invalid_Credentials').textContent = "Incorrect Credentials";
            }
        }

        /* Show Password because I keep having invalid credentials which pisses me off */
        const UserPassword = document.getElementById('UserPassword');
        const ShowPassword = document.getElementById('ShowPassword');

        ShowPassword.addEventListener('click', function () {
            if (this.checked) {
                UserPassword.type = 'text';
            } else {
                UserPassword.type = 'password';
            }
        });


    </script>
</body>

</html>
