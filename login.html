<!DOCTYPE html>
<html>

<head>
    <title>ArtifyPH - Log In</title>
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>
    <header>
        <!-- Logo -->
        <a href="index.html" class="ArtifyPHLogo">
            <img src="assets/images/ArtifyPH_Logo.png" alt="ArtifyPHLogo">
        </a>
    </header>

    <main>
        <section class="AuthCard">

            <h1>Sign In</h1>

            <div class="AuthField">
                <label for="email">Email</label>
                <input type="text" id="email" name="email" placeholder="Enter Email">
            </div>

            <div class="AuthField">
                <label for="UserPassword">Password</label>
                <input type="password" id="UserPassword" name="password" placeholder="Enter Password">

                <div class="ShowPasswordContainer">
                    <input type="checkbox" id="ShowPassword" data-targets="UserPassword">
                    <label for="ShowPassword">Show Password</label>
                </div>
            </div>

            <div class="AuthButton">
                <button onclick="checkLogin()">Sign In</button>
            </div>

            <p id="Invalid_Credentials" class="AuthError"></p>

            <p class="AuthHint">
                Don’t have an account?<br>
                <a href="signup.html">Create Account</a>
            </p>
        </section>
    </main>

    <script src="scripts/account.js"></script>
    <script src="scripts/auth.js"></script>
</body>

</html>
