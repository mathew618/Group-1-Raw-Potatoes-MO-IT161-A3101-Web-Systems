<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtifyPH | Log-In</title>

    <!-- CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./styles/style.css">

    <!-- JavaScript -->
    <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="./scripts/main.js" defer></script>
    <script src="./scripts/account.js" defer></script>
    <script src="./scripts/auth.js" defer></script>
</head>

<body>
    <header id="header"></header>

    <main>

        <section class="container py-4 mt-4">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-6">
                    <div class="card card-artify shadow-sm p-3">
                        <div class="card-body mt-3">
                            <h2 class="authLabel text-center">Log In</h2>
                            <!-- Login Form -->
                            <form id="loginForm" onsubmit="checkLogin(event)">
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email/Username</label>
                                    <input type="text" id="email" class="form-control input-artify"
                                        placeholder="Enter Email" required autocomplete="email">
                                </div>
                                <div class="mb-3">
                                    <label for="UserPassword" class="form-label">Password</label>
                                    <input type="password" id="UserPassword" class="form-control input-artify"
                                        placeholder="Enter Password" required autocomplete="current-password">
                                    <div class="form-check form-check-artify mt-2">
                                        <input class="form-check-input" type="checkbox" id="ShowPassword"
                                            data-targets="UserPassword">
                                        <label class="form-check-label" for="ShowPassword">Show password</label>
                                    </div>
                                </div>
                                <div class="d-grid mb-3">
                                    <button type="submit" class="btn mx-auto btn-artify w-75 p-2">Log In</button>
                                </div>
                                <p id="Invalid_Credentials" class="form-text text-danger small mb-0 text-center"
                                    style="display:none"></p>
                            </form>

                            <!-- Sign Up -->
                            <p class="AuthHint mt-3 text-center">
                                Don’t have an account?<br>
                                <a href="signup.html">Create Account</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>
    
    <footer id="footer"></footer>
</body>

</html>
