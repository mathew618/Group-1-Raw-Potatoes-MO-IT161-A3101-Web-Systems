<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtifyPH | Log-In</title>

    <!-- CSS -->
    <link rel="stylesheet" href="styles/style.css">

    <!-- JavaScript -->
    <script type="module" src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="scripts/main.js" defer></script>
    <script src="scripts/account.js" defer></script>
    <script src="scripts/auth.js" defer></script>
</head>

<body>
    <header id="header"></header>

    <main>
        <section class="AuthCard">

            <h1>Sign In</h1>

            <div class="AuthField">
                <label for="email">Email</label>
                <input type="text" id="email" name="email" placeholder="Enter Email">
            </div>

            <div class="AuthField">
                <label for="UserPassword">Password</label>
                <input type="password" id="UserPassword" name="password" placeholder="Enter Password">

                <div class="ShowPasswordContainer">
                    <input type="checkbox" id="ShowPassword" data-targets="UserPassword">
                    <label for="ShowPassword">Show Password</label>
                </div>
            </div>

            <div class="AuthButton">
                <button onclick="checkLogin()">Log In</button>
            </div>

            <p id="Invalid_Credentials" class="AuthError"></p>

            <p class="AuthHint">
                Don’t have an account?<br>
                <a href="signup.html">Create Account</a>
            </p>
        </section>
    </main>
    
    <footer id="footer"></footer>
</body>

</html>
