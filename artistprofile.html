<!DOCTYPE html>
<html>

<head>
    <title>ArtifyPH - Artist Profile</title>
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/pages/profile.css">
</head>

<body>
    <header>
        <!-- Logo -->
        <a href="index.html" class="ArtifyPHLogo">
            <img src="assets/images/ArtifyPH_Logo.png" alt="ArtifyPHLogo">
        </a>
        <!-- Navigation Bar -->
        <nav>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="myprofile.html">Profile</a></li>
                <li><a href="settings.html">Settings</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Public Artist Profile -->
        <div class="ArtistProfile" id="ArtistProfile">
            <div class="MyUserBannerBG">
                <img id="ArtistBanner" alt="Artist background">
                <div class="MyAvatarProfilePic">
                    <img id="ArtistAvatar" alt="Artist profile picture">
                </div>
            </div>

            <div class="MyProfileDesc">
                <h2 id="ArtistUsername"></h2>
                <p id="ArtistBio"></p>
                <div class="MyProfileStats">
                    <span><b>Artworks:</b> <span id="ArtistArtworkCount">0</span></span>
                    <span><b>Commissions:</b> <span id="ArtistCommissionCount">0</span></span>
                </div>
            </div>
            <hr>

            <div class="PorkNBeans" id="ArtistTabs">
                <button id="button4Portfolio" class="active" onclick="showArtistSection('portfolio')">Portfolio</button>
                <button id="button4Commission" onclick="showArtistSection('commission')">Commission</button>
            </div>

            <div class="ArtistImages" id="ArtistPortfolio">
                <div class="Picnic" id="ArtistPortfolioPicnic"></div>
                <p class="ArtistEmpty" id="ArtistPortfolioEmpty" style="display:none;">No portfolio yet.</p>
            </div>

            <div class="ArtistImages" id="ArtistCommissions" style="display:none;">
                <div class="Picnic" id="ArtistCommissionPicnic"></div>
                <p class="ArtistEmpty" id="ArtistCommissionEmpty" style="display:none;">No commissions yet.</p>
            </div>
        </div>

        <!-- Shown when the artist has no account yet -->
        <section class="ArtistMissing" id="ArtistMissing" style="display:none;">
            <h2>No Profile Here Yet</h2>
            <p id="ArtistMissingText"></p>
            <a href="home.html"><button>Back to Home</button></a>
        </section>

        <!-- Read only preview -->
        <div class="Blackzone" id="ArtworkViewer">
            <div class="BT890">
                <button class="ModalClose" id="ArtworkClose">×</button>
                <div class="UploadSpecimen">
                    <img id="ArtworkImage" alt="Artwork">
                </div>
                <div class="StuffToDo">
                    <h2 id="ViewTitle"></h2>
                    <p id="ViewDesc"></p>
                    <div id="ViewStatusRow" style="display:none;">
                        <label>Status: </label>
                        <span id="ViewStatus"></span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="scripts/account.js"></script>
    <script src="scripts/gallery.js"></script>
    <script src="scripts/artistprofile.js"></script>
</body>

</html>
