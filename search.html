<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtifyPH | Search</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./styles/style.css">

    <!-- JavaScript -->
    <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="./scripts/main.js" defer></script>
    <script src="./scripts/account.js" defer></script>
    <script src="./scripts/search.js" defer></script>
</head>

<body class="d-flex flex-column min-vh-100">
    <header id="header"></header>

    <main class="flex-grow-1">

        <section class="search-section py-4">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-md-8">
                        <div id="searchLabel" class="fs-6 fw-bold text-muted mb-2" style="display:none;"></div>
                        <div id="searchResults" class="list-group"></div>
                        <div id="searchEmpty" class="text-center mt-4" style="display:none;">No users found.</div>
                        <div id="searchHint" class="text-muted small text-center mt-4">Search for users from the header.</div>
                    </div>
                </div>
            </div>
        </section>
        
    </main>
    
    <footer id="footer"></footer>
</body>

</html>
