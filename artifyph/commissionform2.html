<!DOCTYPE html>
<html>

<head>
    <title>ArtifyPH - Commission Form2</title>
    <link rel="stylesheet" href="styles/style.css">
</head>

<body data-commission="details">
    <header>
        <!-- Logo -->
        <a href="index.html" class="ArtifyPHLogo">
            <img src="assets/images/ArtifyPH_Logo.png" alt="ArtifyPHLogo">
        </a>
        <!-- Navigation Bar -->
        <nav>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="settings.html">Settings</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="PageCard CommissionForm2">
            <p class="CommissionRequiredNote"><span class="RequiredStar">*</span> Required Fields</p>
            <p class="CommissionTarget" id="TargetArtist"></p><br>
            <!-- Name/ Username -->
            <label for="name">Name / Username <span class="RequiredStar" aria-hidden="true">*</span></label>
            <input type="text" id="name" name="name" readonly required><br>

            <!-- Email -->
            <label for="email">Email <span class="RequiredStar" aria-hidden="true">*</span></label>
            <input type="email" id="email" name="email" readonly required><br>

            <!-- Commission Type (Dropdown) This is awesome :D -->
            <label for="type">Commission Type <span class="RequiredStar" aria-hidden="true">*</span></label>
            <select id="type" name="type" required>
                <option value="">-- Select Type --</option>
                <option value="Sketch">Digital Art</option>
                <option value="Colored">Traditional Art</option>
                <option value="Fully Rendered">Crafts</option>
            </select><br>

            <!-- Additional Details / User can write what they want to add -->
            <label for="details">Additional Details</label>
            <textarea id="details" name="details" rows="4" cols="40"></textarea><br>

            <!-- Upload Reference -->
            <label for="reference">Upload Reference Image</label>
            <input type="file" id="reference" name="reference"><br>

            <!-- Deadline | DD/MM/YYYY -->
            <label for="deadline">Deadline <span class="RequiredStar" aria-hidden="true">*</span></label>
            <input type="date" id="deadline" name="deadline" required><br>

            <!-- Budget | Must only be number-->
            <label for="budget">Budget (in PHP) <span class="RequiredStar" aria-hidden="true">*</span></label>
            <input type="number" id="budget" name="budget" min="0" step="100" required><br>

            <!-- Preferred Communication Platform -->
            <label for="platform">Preferred Communication Platform</label>
            <input type="text" id="platform" name="platform" placeholder="e.g., Email, Discord, Messenger"><br>

            <!-- Terms of Service Checkbox -->
            <label>
                <input type="checkbox" id="agreement" name="agreement" required>
                I understand that submitting this request does not guarantee the commission will be accepted. <span class="RequiredStar" aria-hidden="true">*</span><br>
                
            </label><br><br>

            <p class="CommissionError" id="CommissionError"></p>

            <!-- Next Button - Will proceed payment-->
            <div class="buttonBox">
                <a href="paymentmethod.html" class="ActionButton" onclick="createCommission(event)">Next</a>
            </div>


        </section>


    </main>

    <script src="scripts/account.js"></script>
    <script src="scripts/commission.js"></script>

</body>

</html>
