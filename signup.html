<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtifyPH | Sign-Up</title>

    <!-- CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./styles/style.css">

    <!-- JavaScript -->
    <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="./scripts/main.js" defer></script>
    <script src="./scripts/account.js" defer></script>
    <script src="./scripts/auth.js" defer></script>
</head>

<body class="d-flex flex-column min-vh-100">
    <header id="header"></header>

    <main class="flex-grow-1">

        <section class="container py-4 mt-4">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6 col-xl-6">
                    <div class="card card-artify shadow-sm p-3">
                        <div class="card-body mt-3">
                            <h2 class="authLabel text-center">Create Account</h2>
                            <!-- Sign Up Form -->
                            <form id="signupForm" onsubmit="createAccount(event)">
                                <div class="mb-3">
                                    <label for="username" class="form-label">Username</label>
                                    <input type="text" id="username" class="form-control input-artify"
                                        placeholder="Enter Username" required autocomplete="username">
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" id="email" class="form-control input-artify"
                                        placeholder="Enter Email" required autocomplete="email">
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label">Password</label>
                                    <input type="password" id="password" class="form-control input-artify"
                                        placeholder="Enter Password" required autocomplete="new-password">
                                </div>
                                <div class="mb-3">
                                    <label for="confirm_password" class="form-label">Confirm Password</label>
                                    <input type="password" id="confirm_password" class="form-control input-artify"
                                        placeholder="Confirm Password" required autocomplete="new-password">

                                    <div class="form-check form-check-artify mt-2">
                                        <input class="form-check-input" type="checkbox" id="ShowPassword"
                                            data-targets="password confirm_password">
                                        <label class="form-check-label" for="ShowPassword">Show password</label>
                                    </div>
                                </div>
                                <div class="d-grid mb-3">
                                    <button type="submit" class="btn mx-auto btn-artify w-75">Create Account</button>
                                </div>
                                <p id="SignupError" class="form-text text-danger small mb-0"
                                    style="display:none"></p>
                            </form>

                            <!-- Log In -->
                            <p class="AuthHint mt-3 text-center">
                                Already have an account?<br>
                                <a href="login.html">Log In</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        
    </main>

    <footer id="footer"></footer>
</body>

</html>
