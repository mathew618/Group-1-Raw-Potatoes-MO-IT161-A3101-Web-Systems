<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtifyPH | Sign-Up</title>

    <!-- CSS -->
    <link rel="stylesheet" href="styles/style.css">

    <!-- JavaScript -->
    <script type="module" src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="scripts/main.js" defer></script>
    <script src="scripts/account.js" defer></script>
    <script src="scripts/auth.js" defer></script>
</head>

<body>
    <header id="header"></header>

    <main>
        <section class="AuthCard">

            <h1>Create Account</h1>

            <div class="AuthField">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter Username">
            </div>

            <div class="AuthField">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter Email">
            </div>

            <div class="AuthField">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter Password">
            </div>

            <div class="AuthField">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password">

                <div class="ShowPasswordContainer">
                    <input type="checkbox" id="ShowPassword" data-targets="password confirm_password">
                    <label for="ShowPassword">Show Password</label>
                </div>
            </div>

            <div class="AuthButton">
                <button onclick="createAccount()">Create Account</button>
            </div>

            <p id="SignupError" class="AuthError"></p>

            <p class="AuthHint">
                Already have an account?<br>
                <a href="login.html">Sign In</a>
            </p>
        </section>
    </main>

    <footer id="footer"></footer>
</body>

</html>
